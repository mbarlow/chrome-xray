<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../styles/theme.css">
  <style>
    body { width: 280px; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
    .head { display: flex; align-items: center; gap: 6px; font-weight: 700; font-size: 14px; }
    .head .zap { color: var(--mauve); }
    .head .ver { margin-left: auto; font-size: 10px; color: var(--overlay0); font-family: var(--font-mono); }
    .origin {
      font-family: var(--font-mono);
      font-size: 11.5px;
      color: var(--subtext1);
      background: var(--mantle);
      border: 1px solid var(--surface0);
      border-radius: 6px;
      padding: 6px 8px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .state { font-size: 11.5px; display: flex; align-items: center; gap: 6px; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--overlay0); }
    .dot.on { background: var(--green); box-shadow: 0 0 6px var(--green); }
    button.wide { width: 100%; padding: 8px; font-size: 13px; }
    .row { display: flex; gap: 6px; }
    .row button { flex: 1 1 0; }
  </style>
</head>
<body>
  <div class="head"><span class="zap">⚡</span>x-ray<span class="ver" id="ver"></span></div>
  <div class="origin" id="origin">…</div>
  <div class="state"><span class="dot" id="dot"></span><span id="state-text">checking…</span></div>
  <button class="wide primary" id="toggle">Activate for this site</button>
  <div class="row">
    <button id="open-panel">Side panel</button>
    <button id="overlay">Overlay</button>
  </div>
  <script type="module" src="popup.js"></script>
</body>
</html>
